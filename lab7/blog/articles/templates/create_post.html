{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="{% static '/css/create_post.css' %}">
        <title>Django Public Blog - создать статью</title>
    </head>
    <body>
        <div class="content">
            <h1>Написать статью</h1>
            <form method="POST">{% csrf_token %}
                <input class="name" type="text" name="title" placeholder="Название статьи" value="{{ form.title }}"><br>
                <textarea name="text" placeholder="Текст статьи">{{ form.text }}</textarea><br>
                <input class="button" type="submit" value="Сохранить"><br>
            </form>
            {{ form.errors }}
        </div>
    </body>
</html>
